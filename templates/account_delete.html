{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Удалить аккаунт?</h1>
    <p class="muted">Действие необратимо. Все анкеты, ответы и ключи доступа будут уничтожены.</p>
  </div>
</div>

<div class="card danger-card">
  <h2>{{ user.username }}</h2>
  <p>
    Будут удалены: <strong>{{ surveys_count }}</strong> анкет,
    <strong>{{ responses_count }}</strong> ответов, все ключи доступа
    и файлы оформления.
  </p>

  <form method="post" action="/account/delete" class="stacked-form">
    <label class="field">
      <span>Введите пароль для подтверждения</span>
      <input type="password" name="password" required autofocus
             autocomplete="current-password">
      {% if errors.password %}
      <span class="field-error">{{ errors.password }}</span>
      {% endif %}
    </label>

    <div class="editor-actions">
      <a class="btn btn-ghost" href="/account">Отмена</a>
      <button type="submit" class="btn btn-danger btn-lg">Удалить навсегда</button>
    </div>
  </form>
</div>
{% endblock %}
