{% extends "base.html" %}
{% block content %}
<div class="auth-card card">
  <h1>Вход</h1>
  <p class="muted small">
    Нужен для создания анкет и просмотра статистики. Отвечать на анкеты
    можно и без аккаунта — по ссылке.
  </p>

  {% if errors.form %}
  <p class="field-error">{{ errors.form }}</p>
  {% endif %}

  <form method="post" action="/login" class="stacked-form">
    <input type="hidden" name="next" value="{{ next }}">

    <label class="field">
      <span>Логин</span>
      <input type="text" name="username" required autofocus autocomplete="username"
             value="{{ values.username|default('') }}">
    </label>

    <label class="field">
      <span>Пароль</span>
      <input type="password" name="password" required autocomplete="current-password">
    </label>

    <button type="submit" class="btn btn-primary">Войти</button>
  </form>

  <p class="muted small auth-alt">
    Нет аккаунта? <a href="/register">Зарегистрироваться</a>.
  </p>
</div>
{% endblock %}
